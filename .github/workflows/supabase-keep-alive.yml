name: Supabase keep-alive

# O plano gratuito do Supabase pausa o projeto após 7 dias sem requisições.
# Uma consulta leve a cada 3 dias mantém o banco ativo.
on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar o banco
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 10 \
            -H "apikey: $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/boards?select=id&limit=1"
